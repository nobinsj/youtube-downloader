server {
    listen 80;
    server_name localhost;

    # ==========================================================
    # GZIP
    # ==========================================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;

    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ==========================================================
    # SECURITY HEADERS
    # ==========================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================================
    # DOWNLOAD FILES
    # MUST COME BEFORE /api/
    # ==========================================================

    location /api/download/ {
        proxy_pass http://backend:8000/download/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 2G;
    }

    location /api/download-all {
        proxy_pass http://backend:8000/download-all;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
    }

    # ==========================================================
    # SSE PROGRESS STREAM
    # ==========================================================

    location /api/progress {
        proxy_pass http://backend:8000/progress;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 24h;

        chunked_transfer_encoding off;
    }

    # ==========================================================
    # ALL OTHER API REQUESTS
    # ==========================================================

    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
    }

    # ==========================================================
    # STATIC ASSETS
    # ==========================================================

    location ~* \.(css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==========================================================
    # REACT ROUTER
    # ==========================================================

    location / {
        try_files $uri $uri/ /index.html;
    }
}